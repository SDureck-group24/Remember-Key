[package]
name = "remember-key"
version = "0.3.0"
description = "Lokaler Passwort- und Login-Manager"
authors = ["you"]
edition = "2021"

[workspace]
members = ["agent"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remember_key_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Kryptografie
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# TOTP
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
url = "2"

uuid = { version = "1", features = ["v4"] }

# KI-Zugriff (Pipe-Protokoll, gemeinsam mit der MCP-Brücke)
rk-agent = { path = "agent" }

# Google-Drive-Sync
ureq = { version = "2", features = ["json"] }
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["windows-native"] }
zxcvbn = "3"

[target.'cfg(windows)'.dependencies]
# Windows Hello (gleiche Version wie Tauri, keine zusätzliche Kompilierung)
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
windows-future = "0.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Argon2 ist im Debug-Build extrem langsam – Abhängigkeiten auch in dev optimieren.
[profile.dev.package."*"]
opt-level = 3
